name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, type-check, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install Playwright Chromium (PDF export tests)
        run: uv run playwright install --with-deps chromium
      - name: Ruff
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy . --exclude 'vigia/db/migrations/versions'
      - name: pytest
        run: uv run pytest

  frontend:
    name: Frontend (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: ESLint
        run: corepack pnpm run lint
      - name: Prettier
        run: corepack pnpm run format:check
      - name: Build (also type-checks)
        run: corepack pnpm run build
      - name: tsc --noEmit
        run: corepack pnpm run typecheck
      - name: Install Playwright Chromium
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start Next.js server
        run: |
          corepack pnpm run start &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Playwright smoke tests
        run: corepack pnpm exec playwright test
        env:
          CI: true
      - name: Stop Next.js server
        if: always()
        run: kill -9 "$(cat /tmp/next-start.pid)" 2>/dev/null || true

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
