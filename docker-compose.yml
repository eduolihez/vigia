services:
  # CPU by default. For NVIDIA GPU support, also pass:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: sqlite+aiosqlite:////data/vigia.db
    volumes:
      - api_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ollama_data:
  api_data:
